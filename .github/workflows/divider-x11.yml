name: Divider X11 replay
on:
  push:
    branches: [evidence/1489-x11]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 48
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_PACKAGE_HERDR_SHELL_OPT_LEVEL: '0'
      DISPLAY: ':91'
      XDG_RUNTIME_DIR: /tmp/xdg-x1489
      XDG_SESSION_TYPE: x11
      HC_VERSION: 0.1.22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {submodules: true, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: {toolchain: '1.95.0'}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with: {version: '0.16.0'}
      - name: Install display, build dependencies and core
        run: |
          scripts/ci-apt pkg-config clang libclang-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev xvfb x11-utils openbox xdotool
          curl -fsSL https://releases.herdr.dev/core/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Replay first on master, then with only the divider fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m700 "$XDG_RUNTIME_DIR"
          Xvfb "$DISPLAY" -screen 0 1280x900x24 -nolisten tcp -ac > /tmp/xvfb.log 2>&1 &
          for i in {1..50}; do xdpyinfo >/dev/null 2>&1 && break; sleep .1; done
          xdpyinfo >/dev/null
          openbox >/tmp/openbox.log 2>&1 &
          unset WAYLAND_DISPLAY
          for mode in before after; do
            if [[ "$mode" = after ]]; then git apply divider.patch; fi
            cargo build --locked --config 'profile.dev.package."*".opt-level=0' --config 'profile.dev.package.herdr-shell.opt-level=0'
            python3 divider-x11.py "$mode"
          done
